# application.properties (anonymisé)
# Ce fichier référence des variables d'environnement. Pour le développement local,
# vous pouvez utiliser `application-local.properties` (ne pas committer de vraies clés).

# JWT secret (lis depuis la variable d'environnement JWT_SECRET, sinon le placeholder)
jwt.secret=${JWT_SECRET:REPLACE_ME}
# MongoDB URI (lis depuis SPRING_DATA_MONGODB_URI)
#spring.data.mongodb.uri=mongodb://localhost:27017/mediawave
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:REPLACE_WITH_MONGODB_URI}
# Placeholder Cloudflare R2 settings for local development - replace via env in production
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY:REPLACE_ME}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY:REPLACE_ME}
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT:REPLACE_WITH_LOCAL_OR_PROD_ENDPOINT}
cloudflare.r2.bucket=${CLOUDFLARE_R2_BUCKET:REPLACE_WITH_BUCKET_NAME}
cloudflare.r2.public-domain=${CLOUDFLARE_R2_PUBLIC_DOMAIN:REPLACE_WITH_PUBLIC_DOMAIN}
