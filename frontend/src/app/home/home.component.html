<app-header></app-header>

<!-- Layout principal -->
<div class="container py-4">
  <div class="row justify-content-center">

    <!-- Colonne centrale (composer + feed) -->
    <div class="col-12 col-lg-8 col-xl-6">

      <!-- Composer (créer un post) -->
      <div class="mb-4">
        <app-post-card></app-post-card>
      </div>

      <!-- Fil d’actualité -->
      <ng-container *ngIf="friendsPosts?.length; else emptyFeed">
        <div class="d-flex flex-column gap-4">
          <div *ngFor="let post of friendsPosts">
            <app-post-form
              [post]="post"
              [enableEdit]="false">
            </app-post-form>
          </div>
        </div>
      </ng-container>

      <!-- État vide -->
      <ng-template #emptyFeed>
        <div class="card border-0 shadow-sm">
          <div class="card-body text-center text-muted py-5">
            <i class="bi bi-people fs-2 d-block mb-2"></i>
            Pas encore de publications de vos amis.
          </div>
        </div>
      </ng-template>

    </div>
  </div>
</div>
