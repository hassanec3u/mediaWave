<!-- Ajout d’un commentaire -->
<div class="mb-3">
  <textarea
    [(ngModel)]="newComment"
    class="form-control"
    rows="3"
    placeholder="Écrire un commentaire…"></textarea>
  <div class="d-flex justify-content-end mt-2">
    <button
      class="btn btn-primary"
      (click)="addComment(newComment)"
      [disabled]="!newComment || !newComment.trim()">
      <i class="bi bi-send me-1"></i> Publier
    </button>
  </div>
</div>

<!-- Liste complète -->
<ng-container *ngIf="comments?.length; else emptyState">
  <ul class="list-group">
    <li
      *ngFor="let comment of comments"
      class="list-group-item d-flex align-items-start justify-content-between">
      <div class="d-flex">
        <div class="rounded-circle bg-light border me-3 d-flex align-items-center justify-content-center"
             style="width:40px;height:40px;">
          <span class="text-muted fw-semibold">
            {{ (comment.authorUsername || 'U') | slice:0:1 | uppercase }}
          </span>
        </div>
        <div>
          <div class="fw-semibold small">
            {{ comment.authorUsername || 'Utilisateur' }}
            <span class="text-muted ms-2">• {{ comment.createdAt | date:'short' }}</span>
          </div>
          <p class="mb-0 mt-1">{{ comment.content }}</p>
        </div>
      </div>

      <div class="ms-3">
        <button
          *ngIf="canDeleteComment(comment)"
          class="btn btn-outline-danger btn-sm"
          type="button"
          (click)="deleteComment(comment.id!)"
          aria-label="Supprimer le commentaire">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </li>
  </ul>
</ng-container>

<!-- État vide -->
<ng-template #emptyState>
  <div class="text-center text-muted py-3">
    <i class="bi bi-chat-square-text fs-4 d-block mb-1"></i>
    Aucun commentaire pour le moment.
  </div>
</ng-template>
