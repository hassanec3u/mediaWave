<div class="card border-0 rounded-0 h-100 vh-100" *ngIf="selectedConversation; else emptyState">
  <!-- En-tête -->
  <div class="card-header bg-white d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
      <i class="bi bi-person-circle text-primary me-2"></i>
      <h5 class="mb-0">{{ getOtherParticipant(selectedConversation.members).username }}</h5>
    </div>
  </div>

  <!-- Messages -->
  <div class="card-body d-flex flex-column p-3" style="height: calc(100vh - 56px);">
    <div class="flex-grow-1 overflow-auto pe-1">
      <div
        *ngFor="let message of messages"
        class="mb-3 d-flex flex-column"
        [ngClass]="{
    'align-items-end': message.receiverId !== senderId,
    'align-items-start': message.receiverId === senderId
  }">

        <!-- bulle -->
        <div
          class="p-2 rounded shadow-sm"
          [ngClass]="{
      'bg-primary text-white': message.receiverId !== senderId,
      'bg-light': message.receiverId === senderId
    }"
          style="max-width: 75%;">
          {{ message.content }}
        </div>

        <!-- heure -->
        <small class="text-muted mt-1">
          {{ message.createdAt | date:'shortTime' }}
        </small>
      </div>

    </div>

 <!-- Saisie -->
    <div class="pt-2">
      <div class="input-group">
        <textarea
          [(ngModel)]="newMessage"
          class="form-control"
          rows="1"
          placeholder="Écrivez un message..."
          (keydown.enter)="sendMessage(newMessage); $event.preventDefault();">
        </textarea>
        <button class="btn btn-primary" type="button" (click)="sendMessage(newMessage)">
          Envoyer
        </button>
      </div>
    </div>
  </div>
</div>

<!-- État vide si aucune conversation sélectionnée -->
<ng-template #emptyState>
  <div class="h-100 vh-100 d-flex align-items-center justify-content-center text-muted">
    <div class="text-center">
      <i class="bi bi-chat-dots fs-1 d-block mb-2"></i>
      Sélectionnez une conversation à gauche.
    </div>
  </div>
</ng-template>
