<app-header></app-header>

<div class="h-100 vh-100">
  <div class="card border-0 rounded-0 h-100">
    <div class="card-header bg-white">
      <div class="d-flex align-items-center">
        <i class="bi bi-chat-left-dots text-primary me-2"></i>
        <h5 class="mb-0">Conversations</h5>
      </div>
    </div>

    <div class="card-body p-3 d-flex flex-column" style="height: calc(100vh - 56px);">
      <!-- Démarrer une nouvelle conversation -->
      <form class="mb-3" (submit)="$event.preventDefault(); startNewConversation()">
        <div class="position-relative">
          <div class="input-group">
            <input
              [(ngModel)]="newParticipantName"
              name="participant"
              type="text"
              class="form-control"
              placeholder="Nom d'un ami…"
              autocomplete="off"
              (input)="onInputChange()"
              (keydown.enter)="onEnter($event)"
              (focus)="showSuggestions = true"
              (blur)="onInputBlur()"
            />
            <button class="btn btn-primary" type="button" (click)="startNewConversation()">
              Démarrer
            </button>
          </div>

          <!-- Suggestions (dropdown) -->
          <ul
            class="dropdown-menu w-100"
            [class.show]="showSuggestions && filteredFriends.length > 0"
            style="max-height: 240px; overflow-y: auto;">
            <li *ngFor="let friend of filteredFriends; let i = index">
              <button
                type="button"
                class="dropdown-item d-flex align-items-center"
                (mousedown)="selectFriend(friend)">
                <div class="rounded-circle bg-light border me-2 d-flex align-items-center justify-content-center"
                     style="width:28px;height:28px;">
            <span class="text-muted fw-semibold">
              {{ (friend.username || 'U') | slice:0:1 | uppercase }}
            </span>
                </div>
                <span>{{ friend.username }}</span>
              </button>
            </li>
          </ul>

          <!-- Alerte si pas de match -->
          <div class="form-text text-danger mt-1" *ngIf="showNoMatch">
            Aucun ami ne correspond à « {{ newParticipantName }} ».
          </div>
        </div>
      </form>


      <!-- Liste des conversations -->
      <div class="flex-grow-1 overflow-auto">
        <ul class="list-group list-group-flush">
          <li
            *ngFor="let conversation of conversations"
            (click)="selectConversation(conversation)"
            class="list-group-item list-group-item-action d-flex flex-column"
            style="cursor:pointer;">
            <div class="fw-semibold">
              {{ getOtherParticipant(conversation.members).username }}
            </div>
            <small class="text-muted text-truncate">
               {{ conversation.lastMessage || '—' }}
            </small>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
