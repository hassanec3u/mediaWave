<div class="card shadow-sm border-0">
  <div class="card-body">
    <div class="d-flex align-items-center mb-3">
      <div class="position-relative">
        <img
          [src]="userInfo.profilePicture || defaultImage"
          alt="photo de profil"
          class="rounded-circle me-3"
          style="width:72px;height:72px;object-fit:cover;cursor:pointer;"
          (click)="onProfileImageClick()">
        <input
          type="file"
          #fileInput
          class="d-none"
          (change)="onFileSelected($event)"
          accept="image/*">
      </div>

      <div class="flex-grow-1">
        <h5 class="mb-1 text-primary">{{ userInfo.username }}</h5>
        <div class="text-muted small d-flex align-items-center">
          <i class="bi bi-envelope me-2"></i>
          <span>{{ userInfo.email }}</span>
        </div>
        <div class="text-muted small d-flex align-items-center mt-1">
          <i class="bi bi-cake2 me-2"></i>
          <span>{{ birthdate }}</span>
        </div>
        <div class="text-muted small d-flex align-items-center mt-1">
          <i class="bi bi-geo-alt me-2"></i>
          <span>{{ pays }}</span>
        </div>
      </div>
    </div>

    <hr class="text-muted">

    <div class="mb-3">
      <div class="text-uppercase small text-muted mb-1">Bio</div>
      <p class="mb-0">{{ userInfo.bio || 'Aucune bio pour le moment.' }}</p>
    </div>

    <div class="d-grid">
      <button
        *ngIf="isMyProfile()"
        class="btn btn-primary"
        type="button"
        (click)="openFormUpdate()">
        <i class="bi bi-pencil-square me-1"></i>
        Modifier le profil
      </button>
    </div>
  </div>
</div>
