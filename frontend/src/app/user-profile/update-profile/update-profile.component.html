<mat-dialog-content class="p-0">
  <div class="p-3">
    <form [formGroup]="form" class="needs-validation" novalidate>

      <!-- Bio -->
      <div class="mb-3">
        <label class="form-label">Bio</label>
        <textarea
          class="form-control"
          rows="4"
          placeholder="Votre bio..."
          formControlName="bio"
          required></textarea>
        <div class="form-text text-danger" *ngIf="form.get('bio')?.dirty && form.get('bio')?.hasError('required')">
          La bio est <strong>requise</strong>
        </div>
        <div class="form-text text-danger" *ngIf="form.get('bio')?.dirty && form.get('bio')?.hasError('minlength')">
          La bio doit contenir au moins <strong>10 caractères</strong>
        </div>
      </div>

      <!-- Date de naissance -->
      <div class="mb-3">
        <label class="form-label">Date de naissance</label>
        <mat-form-field appearance="outline" class="w-100">
          <input matInput [matDatepicker]="picker" placeholder="JJ/MM/AAAA" formControlName="birthday">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <div class="form-text text-danger"
             *ngIf="form.get('birthday')?.dirty && form.get('birthday')?.hasError('required')">
          La date de naissance est <strong>requise</strong>
        </div>
      </div>

      <!-- Pays -->
      <div class="mb-3">
        <label class="form-label">Localisation</label>
        <input
          type="text"
          class="form-control"
          placeholder="Ville, Pays"
          formControlName="pays">
        <div class="form-text text-danger" *ngIf="form.get('pays')?.dirty && form.get('pays')?.hasError('required')">
          La localisation est <strong>requise</strong>
        </div>
      </div>
    </form>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="px-3 pb-3">
  <div class="d-flex justify-content-end gap-2 w-100">
    <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">
      Annuler
    </button>
    <button type="button" class="btn btn-primary" (click)="onSubmit()">
      Enregistrer
    </button>
  </div>
</mat-dialog-actions>
