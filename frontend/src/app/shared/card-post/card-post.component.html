<!-- Carte post -->
<div class="card shadow border-0">
  <!-- En-tête auteur + menu -->
  <div class="card-header bg-white border-0 pb-0">
    <div class="d-flex justify-content-between align-items-start">
      <div class="d-flex align-items-center">
        <img
          [src]="userProfilePicture || defaultImage"
          alt="Photo de profil"
          class="rounded-circle me-2"
          style="width:40px;height:40px;object-fit:cover;">
        <div>
          <div class="fw-semibold">{{ post.publisherName }}</div>
          <div class="text-muted small">{{ post.postDate | date:'dd-MM-yyyy' }}</div>
        </div>
      </div>

      <!-- Actions du post -->
      <div *ngIf="enableEdit" class="dropdown">
        <button class="btn btn-light btn-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-three-dots"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <button class="dropdown-item text-danger" (click)="openDeleteDialog(post.id)">
              <i class="bi bi-trash me-2"></i>Supprimer ce post
            </button>
          </li>
          <li>
            <button class="dropdown-item" (click)="editPost()">
              <i class="bi bi-pencil-square me-2"></i>Modifier ce post
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Corps du post -->
  <div class="card-body">
    <h5 class="card-title mb-2">{{ post.title }}</h5>
    <p class="card-text">{{ post.content }}</p>

    <img
      *ngIf="post.postPicture"
      [src]="post.postPicture"
      alt="Image du post"
      class="img-fluid rounded mb-3"
      style="max-height:380px; object-fit:cover; width:100%;">
  </div>

  <!-- Pied de carte : like + actions -->
  <div class="card-footer bg-white border-0 pt-0">
    <div class="d-flex align-items-center gap-3">
      <app-like [postId]="post.id!"></app-like>
      <!-- Exemple bouton commentaire si besoin -->
      <!-- <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-chat me-1"></i> Commenter</button> -->
    </div>
  </div>
</div>

<!-- Zone commentaires attachée au post -->
<div class="mt-3">
  <app-comment-list [postId]="post.id!"></app-comment-list>
</div>
