<div class="card border-0 shadow-sm">
  <div class="card-body">
    <!-- Titre avec icône d’alerte -->
    <div class="d-flex align-items-center mb-2">
      <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-flex align-items-center justify-content-center me-2" style="width:36px;height:36px;">
        <i class="bi bi-exclamation-triangle-fill"></i>
      </div>
      <h5 class="mb-0">Confirmer la suppression</h5>
    </div>

    <!-- Contenu -->
    <mat-dialog-content class="p-0">
      <p class="text-muted mb-0">Voulez-vous vraiment supprimer ce post ? Cette action est irréversible.</p>
    </mat-dialog-content>

    <!-- Actions -->
    <mat-dialog-actions align="end" class="mt-3 p-0">
      <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">
          Annuler
        </button>
        <button type="button" class="btn btn-danger" (click)="onConfirm()">
          Supprimer
        </button>
      </div>
    </mat-dialog-actions>
  </div>
</div>
