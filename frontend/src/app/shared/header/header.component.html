<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
  <div class="container-fluid">
    <!-- Brand -->
    <a class="navbar-brand fw-semibold" style="cursor:pointer" (click)="navigateHome()">
      MediaWave
    </a>

    <!-- Toggler (mobile) -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mwNavbar"
            aria-controls="mwNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible content -->
    <div class="collapse navbar-collapse" id="mwNavbar">
      <!-- (Optionnel) Barre de recherche centrée -->
      <!-- <form class="d-none d-lg-flex mx-auto w-50">
         <input class="form-control form-control-sm" type="search" placeholder="Rechercher…" aria-label="Search">
       </form>
 -->
      <ul class="navbar-nav ms-auto align-items-center">
        <!-- Si non authentifié -->
        <ng-container *ngIf="!isAuthenticated">
          <li class="nav-item me-2">
            <button class="btn btn-outline-light btn-sm" type="button" (click)="login()">Se connecter</button>
          </li>
          <li class="nav-item">
            <button class="btn btn-light btn-sm text-primary" type="button" (click)="register()">S'inscrire</button>
          </li>
        </ng-container>

        <!-- Si authentifié -->
        <ng-container *ngIf="isAuthenticated">

          <!-- (Optionnel) icônes rapides -->
          <li class="nav-item me-2 d-none d-lg-inline">
            <a class="nav-link" (click)="navigateToConversations()" style="cursor:pointer">
              <i class="bi bi-chat-dots"></i>
            </a>
          </li>
          <li class="nav-item me-2 d-none d-lg-inline">
            <a class="nav-link" (click)="navigateToFriend()" style="cursor:pointer">
              <i class="bi bi-people"></i>
            </a>
          </li>


          <!-- Avatar + menu -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userMenu" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">
              <img [src]="user?.profilePicture || defaultImage"
                   alt="Profil"
                   class="rounded-circle me-2"
                   style="width:32px;height:32px;object-fit:cover;">
              <span class="d-none d-sm-inline">{{ user?.username || 'Mon compte' }}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userMenu">
              <li>
                <button class="dropdown-item" type="button" (click)="navigateToProfile()">Profil</button>
              </li>
              <li>
                <button class="dropdown-item" type="button" (click)="navigateToFriend()">Amis</button>
              </li>
              <li>
                <button class="dropdown-item" type="button" (click)="navigateToConversations()">Messages</button>
              </li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li>
                <button class="dropdown-item text-danger" type="button" (click)="logout()">Se déconnecter</button>
              </li>
            </ul>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>
