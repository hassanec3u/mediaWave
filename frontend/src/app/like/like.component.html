<button
  class="btn btn-link p-0 border-0 d-flex align-items-center"
  (click)="toggleLike()"
  [attr.aria-pressed]="liked"
  style="text-decoration: none;">

  <!-- Icône cœur -->
  <i
    class="bi"
    [ngClass]="liked ? 'bi-heart-fill text-danger' : 'bi-heart text-secondary'">
  </i>

  <!-- Compteur -->
  <span class="ms-2 large fw-semibold">{{ likes }}</span>
</button>
